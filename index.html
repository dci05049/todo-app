<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Todo App</h1>
    </header>

    <form id="todo-form" class="input-bar">
      <label for="todo-input" class="visually-hidden">What needs to be done?</label>
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        autofocus
      >
      <button type="submit" id="add-btn" disabled>Add</button>
    </form>

    <div id="filter-bar" class="filter-bar" hidden>
      <div class="filter-buttons">
        <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <span id="item-count" class="item-count">0 items left</span>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state">No todos yet. Add one above!</p>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
